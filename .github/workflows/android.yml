name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test and build
        run: gradle clean testDebugUnitTest assembleDebug
      - name: Privacy audit
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "INTERNET permission found"
            exit 1
          fi
          if grep -R -E "Firebase|Analytics" app/src/main app/build.gradle.kts; then
            echo "Telemetry SDK marker found"
            exit 1
          fi
          if grep -R -E "https?://" app/src/main/java app/build.gradle.kts; then
            echo "Network endpoint found in application code"
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: teclado-joaoldsxyzbr-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish version release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName"
            exit 1
          fi

          TAG="v${VERSION}"
          APK="teclado-joaoldsxyzbr-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping"
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Teclado joaoldsxyzbr $TAG" \
              --generate-notes
          fi
