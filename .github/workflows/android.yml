name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test and build
        run: gradle clean testDebugUnitTest assembleDebug
      - name: Privacy audit
        run: |
          if ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "Updater requires INTERNET permission"
            exit 1
          fi
          if ! grep -q "android.permission.REQUEST_INSTALL_PACKAGES" app/src/main/AndroidManifest.xml; then
            echo "Updater requires REQUEST_INSTALL_PACKAGES permission"
            exit 1
          fi
          if grep -R -E "Firebase|Analytics|Telemetry" app/src/main app/build.gradle.kts; then
            echo "Telemetry SDK marker found"
            exit 1
          fi
          if grep -R -E "HttpURLConnection|URLConnection|java\.net\.URL|https?://" app/src/main/java/br/com/teclado/ime; then
            echo "Network access found inside IME code"
            exit 1
          fi
          if grep -R --include='*.kt' "http://" app/src/main/java; then
            echo "Plain HTTP URL found in application code"
            exit 1
          fi
          if grep -R --include='*.kt' --exclude-dir=update "https://" app/src/main/java/br/com/teclado; then
            echo "HTTPS endpoint found outside updater package"
            exit 1
          fi
          if [ -d app/src/main/java/br/com/teclado/update ]; then
            while IFS= read -r url; do
              case "$url" in
                https://api.github.com/*|https://github.com/*|https://*.githubusercontent.com/*) ;;
                *) echo "Disallowed updater endpoint: $url"; exit 1 ;;
              esac
            done < <(grep -RhoE 'https://[^"[:space:])}]+' app/src/main/java/br/com/teclado/update || true)
          fi
      - name: Prepare permanent release signing
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_BUNDLE_B64: ${{ secrets.ANDROID_SIGNING_BUNDLE_B64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_BUNDLE_B64" ]; then
            echo "::error::Missing repository secret ANDROID_SIGNING_BUNDLE_B64"
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/android-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_SIGNING_BUNDLE_B64" | base64 --decode > "$SIGNING_DIR/signing-bundle.tar.gz"
          tar -xzf "$SIGNING_DIR/signing-bundle.tar.gz" -C "$SIGNING_DIR"

          if [ ! -f "$SIGNING_DIR/teclado-release.p12" ] || [ ! -f "$SIGNING_DIR/password.txt" ]; then
            echo "::error::Signing bundle is invalid"
            exit 1
          fi

          SIGNING_PASSWORD=$(cat "$SIGNING_DIR/password.txt")
          echo "::add-mask::$SIGNING_PASSWORD"
          echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/teclado-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.ref == 'refs/heads/main'
        run: gradle assembleRelease
      - name: Verify release certificate
        if: github.ref == 'refs/heads/main'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          CERT_OUTPUT=$($APKSIGNER verify --print-certs "$APK")
          CERT_LINE=$(printf '%s\n' "$CERT_OUTPUT" | grep -iE 'certificate.*sha-?256.*digest' | head -n 1 || true)
          ACTUAL=$(printf '%s\n' "$CERT_LINE" | grep -Eo '([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          EXPECTED=$(tr '[:upper:]' '[:lower:]' < app/signing/release-cert-sha256.txt | tr -d ':[:space:]')
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release certificate fingerprint mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            echo "apksigner certificate output:"
            printf '%s\n' "$CERT_OUTPUT"
            exit 1
          fi
      - name: Upload signed release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: teclado-joaoldsxyzbr-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish version release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName"
            exit 1
          fi

          TAG="v${VERSION}"
          APK="teclado-joaoldsxyzbr-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping"
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Teclado joaoldsxyzbr $TAG" \
              --generate-notes
          fi
